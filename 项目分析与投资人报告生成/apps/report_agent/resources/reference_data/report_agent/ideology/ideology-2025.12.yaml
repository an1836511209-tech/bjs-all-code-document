      - rule_id: R8
        pattern: "党中央权威和统一领导"
        suggestion: "党中央权威和集中统一领导"
        severity: block
      - rule_id: R9
        pattern: "人民群众日益增长的美好生活需要"
        suggestion: "人民日益增长的美好生活需要"
        severity: block
      - rule_id: R10
        pattern: "中华民族伟大的复兴梦"
        suggestion: "中华民族伟大复兴中国梦"
        severity: block
      - rule_id: R11
        pattern: "开启全面建设社会主义现代化国家征程"
        suggestion: "开启全面建设社会主义现代化国家新征程"
        severity: block
      - rule_id: R12
        pattern: "全面建设社会主义现代化强国"
        suggestion: "全面建设社会主义现代化国家 / 全面建成社会主义现代化强国"
        severity: block
        notes: "依上下文选择"
      - rule_id: R13
        pattern: "实现第二个百年目标"
        suggestion: "实现第二个百年奋斗目标"
        severity: block
      - rule_id: R14
        pattern: "“十四五”战略规划|十四五发展规划|十四五战略规划"
        suggestion: "“十四五”规划"
        severity: block
      - rule_id: R15
