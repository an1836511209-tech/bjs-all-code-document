        suggestion: "党的十八大 / 十九大 / 二十大 / 二十届三中全会 / 二十届四中全会"
        severity: block
        notes: "首次出现需加「党的」前缀"
      - rule_id: R26
        pattern: "市十三次党代会"
        suggestion: "市第十三次党代会"
