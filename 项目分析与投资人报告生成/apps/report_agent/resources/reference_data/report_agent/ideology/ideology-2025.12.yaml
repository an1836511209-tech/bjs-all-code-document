# 意识形态与表述规范词表（2025.12）
# 来源：表述勘误表2025.12.docx
# 范围：R1–R80（政治表述 + 固定搭配 + 法律法规全称）
# 不包含：R81–R100（敏感词 + 错别字），留待 ADR-0004 硬档实施。

version: "2025.12"
source: "表述勘误表2025.12.docx"

categories:
  - id: political_expression
    label: 涉重要表述
    items:
      - rule_id: R1
        pattern: "习总书记|习主席"
        suggestion: "习近平总书记 / 习近平主席"
        severity: block
        notes: "领导人姓名专称"
      - rule_id: R2
        pattern: "习近平总书记的讲话"
        suggestion: "习近平总书记重要讲话"
        severity: block
      - rule_id: R3
        pattern: "习近平总书记的指示批示精神"
        suggestion: "习近平总书记的重要指示批示精神"
        severity: block
      - rule_id: R4
        pattern: "以习近平总书记为核心的党中央"
        suggestion: "以习近平同志为核心的党中央"
        severity: block
      - rule_id: R5
        pattern: "新时代中国特色社会主义思想"
        suggestion: "习近平新时代中国特色社会主义思想"
        severity: block
      - rule_id: R6
        pattern: "习近平新时代中国特色主题教育"
        suggestion: "学习贯彻习近平新时代中国特色社会主义思想主题教育"
        severity: block
      - rule_id: R7
        pattern: "习近平法制思想|习近平总书记法治思想"
        suggestion: "习近平法治思想"
        severity: block

  - id: policy_route
