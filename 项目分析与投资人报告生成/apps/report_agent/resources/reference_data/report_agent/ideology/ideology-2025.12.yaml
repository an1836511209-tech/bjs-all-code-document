        severity: block
      - rule_id: R16
        pattern: "人才兴国战略"
        suggestion: "人才强国战略"
        severity: block
      - rule_id: R17
        pattern: "健全完善全面从严治党体系"
        suggestion: "健全全面从严治党体系"
        severity: block
      - rule_id: R18
        pattern: "“一带一路”战略|一带一路战略|“一带一路”倡导|一带一路倡议"
        suggestion: "“一带一路”倡议"
        severity: block
      - rule_id: R19
        pattern: "不敢腐、不能腐、不易腐"
        suggestion: "不敢腐、不能腐、不想腐"
        severity: block
      - rule_id: R20
        pattern: "八项规定"
        suggestion: "中央八项规定"
        severity: block
      - rule_id: R21
        pattern: "全面解决从严治党"
        suggestion: "解决全面从严治党"
        severity: block

