[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bjs-data-mcp"
version = "0.1.0"
description = "Business data MCP server for BJS investment reports"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.25,<5",
  "mcp>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pymysql>=1.1,<2",
  "pyyaml>=6.0.3,<7",
]

[project.scripts]
data-mcp = "data_mcp.entrypoints:main"

[dependency-groups]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
]
lint = [
  "mypy>=1.18,<2",
  "ruff>=0.13,<1",
  "types-jsonschema>=4.25,<5",
  "types-openpyxl>=3.1,<4",
  "types-pymysql>=1.1,<2",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["data_mcp"]
warn_unused_configs = true
check_untyped_defs = true
