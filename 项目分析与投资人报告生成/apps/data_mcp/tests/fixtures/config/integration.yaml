listed_peer_match:
  data_dir: "tests/fixtures/data/listed_peers"
  index_dir: "../../.runtime/data_mcp/listed_peer_index"
  field_weights:
    industry_chain_position: 0.375
    products_services: 0.375
    track_tags: 0.12
    target_customers: 0.08
    profit_model: 0.05
  constraints:
    require_sum_approx: 1.0
    sum_tolerance: 0.001
    require_chain_plus_products_min: 0.75
  top_k_recall: 80
  top_n_return: 10
  enable_rerank: false
  score_threshold:
    high: 0.72
    medium: 0.55
  embedding:
    dev:
      backend: hash
      url: "https://qwen3emb.agentspro.cn/v1/embeddings"
      api_key: test-api-key
      model: "Qwen3-Embedding-0.6B"
      timeout_seconds: 60
      batch_size: 32
    uat:
      backend: hash
      url: "http://10.224.98.172/v1/embeddings"
      api_key: test-api-key
      model: "Qwen3-Embedding-0.6B"
      timeout_seconds: 60
    prod:
      backend: hash
      url: ""
      api_key: test-api-key
      model: ""
      timeout_seconds: 60
  rerank:
    dev:
      url: "https://qwen3rerank.agentspro.cn/v1/rerank"
      api_key: test-api-key
      model: "Qwen3-Reranker-0.6B"
      timeout_seconds: 60
    uat:
