openapi: 3.0.3
info:
  title: 北交所录入助审系统API
  description: |
    北交所信息披露智能录入和助审系统接口文档
    
    ## 主要功能模块
    - 服务健康检查
    - 文件质量检测
    - 字段信息提取
    - 字段规则审核
    - 任务管理
    - 规则配置管理
    
    ## 技术特点
    - RESTful API设计
    - 统一的响应格式
    - 完善的错误处理
    - JWT身份认证
    
  version: 1.0.0
  contact:
    name: API支持团队
    email: support@example.com

servers:
  - url: http://101.126.54.157:7580
    description: 生产环境（智能体根地址）
  - url: https://api-staging.example.com
    description: 测试环境（智能体根地址）
  - url: http://localhost:8580
    description: 开发环境（智能体根地址）
  - url: http://101.126.54.157:7580/api/v1
    description: 生产环境（业务 API）
  - url: https://api-staging.example.com/api/v1
    description: 测试环境（业务 API）
  - url: http://localhost:8580/api/v1
    description: 开发环境（业务 API）

tags:
  - name: 服务健康检查
    description: 智能体服务健康检查接口
  - name: 文件质量检测
    description: 文件质量检测相关接口
  - name: 文件分类
    description: 文件智能分类相关接口
  - name: 字段提取
    description: 字段信息提取相关接口
  - name: 规则审核
    description: 字段规则审核相关接口
  - name: 任务管理
    description: 任务查询和管理接口
  - name: 规则配置
    description: 规则配置管理接口

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags:
        - 服务健康检查
      summary: 智能体健康检查
      description: |
        检查智能体服务是否正常运行，用于负载均衡探活、部署验收和运维监控。
        该接口挂载在服务根路径，无需 JWT 认证。
      operationId: healthCheck
      security: []
      servers:
        - url: http://101.126.54.157:7580
          description: 生产环境
        - url: https://api-staging.example.com
          description: 测试环境
        - url: http://localhost:8580
          description: 开发环境
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                    description: 服务状态
                  service:
                    type: string
                    example: 北交所录入助审系统
                    description: 服务名称
                  version:
                    type: string
                    example: "1.0.0"
                    description: 服务版本号
                  timestamp:
                    type: string
                    format: date-time
                    example: "2025-10-22T10:00:00Z"
                    description: 响应时间（UTC）
              example:
                status: healthy
                service: 北交所录入助审系统
                version: "1.0.0"
                timestamp: "2025-10-22T10:00:00Z"

  /file/quality-check:
    post:
      tags:
        - 文件质量检测
      summary: 文件质量检测
      description: |
        同步检测上传附件的质量，包括清晰度、分辨率、遮挡检测等。
        支持PDF和图片格式文件。
        
        **PDF处理说明：**
        - 自动转换PDF所有页面为图像进行检测（最多10页）
        - 采用"一票否决"原则：任何一页不合格，整个PDF标记为不合格
        - 返回结果包含页面统计和聚合评估
        
        **检测算法说明：**
        - **清晰度**：多指标融合算法（拉普拉斯方差+Tenengrad梯度+方差系数），0-100分评分制
        - **分辨率**：检查图像尺寸是否满足最低要求（最低600x800，推荐1200x1600）
        - **遮挡**：检测图像中的噪点、黑色区域和异常遮挡物
      operationId: checkFileQuality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  description: 待检测的文件列表
                  items:
                    $ref: '#/components/schemas/FileInput'
                request_id:
                  type: string
                  description: 请求唯一标识，用于幂等性控制
                  example: "req_123456789"
            examples:
              
              质量最差测试用例:
                summary: 质量最差的文件测试用例
                description: 用于测试系统对低质量文件的检测能力
                value:
                  files:
                    - file_url: "https://pefile.oss-cn-beijing.aliyuncs.com/mmh/%E4%B8%B4%E6%97%B6%E6%96%87%E4%BB%B6%E5%A4%B9/bad_quality.png"
                      file_name: "信息披露申请书.pdf"
                      file_type: "info_disclosure_application"
                  request_id: "req_20251024100001"
              
              质量良好测试用例:
                summary: 质量良好的文件测试用例
                description: 用于测试系统对高质量文件的检测能力
                value:
                  files:
                    - file_url: "https://pefile.oss-cn-beijing.aliyuncs.com/mmh/%E4%B8%B4%E6%97%B6%E6%96%87%E4%BB%B6%E5%A4%B9/good_quality.png"
                      file_name: "信息披露申请书.pdf"
                      file_type: "info_disclosure_application"
                  request_id: "req_20251024100001"
              
              质量中等测试用例:
                summary: 质量中等的文件测试用例（PDF格式）
                description: 用于测试系统对中等质量PDF文件的检测能力
                value:
                  files:
                    - file_url: "https://pefile.oss-cn-beijing.aliyuncs.com/mmh/临时文件夹/房屋租赁合同.pdf"
                      file_name: "信息披露申请书.pdf"
                      file_type: "info_disclosure_application"
                  request_id: "req_20251024100001"
      responses:
        '200':
          description: 检测成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileQualityCheckResponse'
              examples:
                质量良好响应示例:
                  summary: 高质量文件检测结果
                  value:
                    code: 200
                    message: "success"
                    trace_id: "trace_20251024100001"
                    timestamp: "2025-10-24T10:00:00Z"
                    data:
                      - file_id: "file_20251024100001"
                        file_name: "信息披露申请书.pdf"
                        file_type: "info_disclosure_application"
                        file_url: "https://pefile.oss-cn-beijing.aliyuncs.com/mmh/%E4%B8%B4%E6%97%B6%E6%96%87%E4%BB%B6%E5%A4%B9/good_quality.png"
                        quality_status: "passed"
                        quality_result:
                          clarity: "passed"
                          clarity_score: 89.09
                          resolution: "passed"
                          resolution_value: "1920x1080"
                          occlusion: "passed"
                          occlusion_score: 0.02
                        message: "文件质量校验通过"
                
                质量中等响应示例:
                  summary: 中等质量文件检测结果
                  value:
                    code: 200
                    message: "success"
                    trace_id: "trace_20251024100002"
                    timestamp: "2025-10-24T10:00:00Z"
                    data:
                      - file_id: "file_20251024100002"
                        file_name: "信息披露申请书.pdf"
                        file_type: "info_disclosure_application"
                        file_url: "https://pefile.oss-cn-beijing.aliyuncs.com/mmh/临时文件夹/房屋租赁合同.pdf"
                        quality_status: "warning"
                        quality_result:
                          clarity: "warning"
                          clarity_score: 45.6
                          resolution: "passed"
                          resolution_value: "1200x1600"
                          occlusion: "passed"
                          occlusion_score: 0.15
                        message: "文件质量一般，建议重新上传更清晰的文件"
                
                质量最差响应示例:
                  summary: 低质量文件检测结果
                  value:
                    code: 200
                    message: "success"
                    trace_id: "trace_20251024100003"
                    timestamp: "2025-10-24T10:00:00Z"
                    data:
                      - file_id: "file_20251024100003"
                        file_name: "信息披露申请书.pdf"
                        file_type: "info_disclosure_application"
                        file_url: "https://pefile.oss-cn-beijing.aliyuncs.com/mmh/%E4%B8%B4%E6%97%B6%E6%96%87%E4%BB%B6%E5%A4%B9/bad_quality.png"
                        quality_status: "failed"
                        quality_result:
                          clarity: "failed"
                          clarity_score: 18.3
                          resolution: "warning"
                          resolution_value: "800x600"
                          occlusion: "failed"
                          occlusion_score: 0.45
                        message: "文件质量不合格，请重新上传清晰的文件"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /file/classification:
    post:
      tags:
        - 文件分类
      summary: 文件智能分类
      description: |
        对上传的文件进行智能分类，返回对应的文件类型枚举值。
        
        **处理流程：**
        1. 下载文件并判断格式
        2. 解析文件前两页内容（用于减少处理时间）
        3. 使用 LLM 智能分类
        4. 返回分类结果
        
        **支持的文件格式：**
        - PDF: 使用 OCR 解析
        - Word (.doc, .docx): 转换为 PDF 后解析
        - 图片 (JPG, PNG, BMP, TIFF, WebP): 直接 OCR 解析
        - Excel (.xlsx, .xlsm): 提取文本内容
        - CSV: 提取文本内容
      operationId: classifyFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationRequest'
            examples:
              多文件分类:
                summary: 多文件分类请求示例
                value:
                  files:
                    - file_url: "https://example.com/files/doc1.pdf"
                      file_name: "信息披露申请书.pdf"
                    - file_url: "https://example.com/files/doc2.docx"
                      file_name: "内部决议.docx"
                    - file_url: "https://example.com/files/license.jpg"
                      file_name: "营业执照.jpg"
                  request_id: "req_20251114100001"
      responses:
        '200':
          description: 分类成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
              examples:
                分类成功示例:
                  summary: 多文件分类成功返回
                  value:
                    code: 200
                    message: "success"
                    trace_id: "trace_20251114100001"
                    timestamp: "2025-11-14T10:00:00Z"
                    data:
                      results:
                        - file_name: "信息披露申请书.pdf"
                          file_url: "https://example.com/files/doc1.pdf"
                          file_type: "info_disclosure_application"
                        - file_name: "内部决议.docx"
                          file_url: "https://example.com/files/doc2.docx"
                          file_type: "internal_decision"
                        - file_name: "营业执照.jpg"
                          file_url: "https://example.com/files/license.jpg"
                          file_type: "business_license"
                      processing_time_ms: 2500
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /extraction/sync:
    post:
      tags:
        - 字段提取
      summary: 同步字段提取
      description: |
        从多个附件中同步提取字段信息，返回完整结果。
        如果处理时间超过timeout，将返回taskId供后续查询。
      operationId: extractFieldsSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionRequest'
            example:
              extraction_type: "有纸大宗实物"
              files:
                - file_url: "https://example.com/files/application.pdf"
                  file_name: "信息披露申请书.pdf"
                  file_type: "info_disclosure_application"
                - file_url: "https://example.com/files/certificate.pdf"
                  file_name: "房屋所有权证.pdf"
                  file_type: "property_certificate"
              rule_config_id: "rule_dzswv10"
              timeout: 1000
              request_id: "req_20251022100002"
      responses:
        '200':
          description: 提取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /audit/sync:
    post:
      tags:
        - 规则审核
      summary: 同步规则审核
      description: |
        对用户确认的字段和附件进行规则审核，返回完整审核结果。
        支持数据交叉验证、字段值内容审核、字段值交叉验证等多种审核类型。
        
        **返回数据说明：**
        1. 返回结果包含请求入参confirmed_fields
        2. 对于"文件审核"类型的规则，返回结果包含：
           - file_type: 文件类型（审核规则中的material_name）
           - audit_points: 审核要点原始内容（审核规则中的audit_content）
           - uploaded_files: 已上传文件列表（从入参files中匹配）
           - audit_point_details: 审核要点详情列表（每个要点独立的审核结果）
           - audit_result/audit_explanation/confidence/audit_details: 均为null（查看audit_point_details）
        3. 对于confirmed_fields中未被审核的字段，会标记为"需人工审核"(manual_review)
        4. summary中包含manual_review计数
      operationId: auditFieldsSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequest'
            examples:
              带附件的审核请求:
                summary: 带附件的审核请求
                description: 需要参考附件内容进行审核
                value:
                  audit_type: "有纸大宗实物"
                  confirmed_fields:
                    - field_name: "坐落位置"
                      field_value: "北京市朝阳区建国路1号"
                      field_type: "text"
                    - field_name: "房屋面积"
                      field_value: "150.5"
                      field_type: "text"
                  files:
                    - file_url: "https://example.com/files/certificate.pdf"
                      file_name: "房屋所有权证.pdf"
                      file_type: "property_certificate"
                  rule_config_id: "rule_dzswv10"
                  timeout: 1000
              
              不传附件的审核请求:
                summary: 纯字段逻辑审核（不传附件）
                description: 只需要对字段值进行逻辑校验，不需要附件
                value:
                  audit_type: "有纸大宗实物"
                  confirmed_fields:
                    - field_name: "房屋面积"
                      field_value: 150.5
                      field_type: "text"
                    - field_name: "土地面积"
                      field_value: 120.0
                      field_type: "text"
                  files: []
                  request_id: "req_20251209100001"
      responses:
        '200':
          description: 审核成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResponse'
              examples:
                完整审核结果示例:
                  summary: 包含字段审核、文件审核和人工审核的完整返回示例（按规则维度组织）
                  value:
                    code: 200
                    message: "success"
                    trace_id: "trace_20251118100001"
                    timestamp: "2025-11-18T10:00:00Z"
                    data:
                      request_id: "req_20251118100001"
                      task_id: "task_20251118100001"
                      status: "completed"
                      audit_type: "有纸大宗实物"
