[tool.poetry]
name = "bjs-luruzhushen"
version = "1.1.0"
description = "北交所录入助审系统 - 信息披露智能录入和助审系统"
authors = ["Your Team <support@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.23"
alembic = "^1.13.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^1.0.0"
httpx = "^0.25.2"
redis = "^5.0.1"
celery = "^5.3.4"
pillow = "^10.1.0"
pypdf = "^3.17.4"
python-docx = "^1.1.0"
openpyxl = "^3.1.2"
opencv-python = "^4.8.1"
numpy = "^1.26.2"
loguru = "^0.7.2"
pyyaml = "^6.0.1"
aiofiles = "^23.2.1"
sse-starlette = "^1.8.2"
PyMuPDF = "^1.23.0"
scikit-image = "^0.22.0"
jinja2 = "^3.1.2"
img2pdf = "^0.5.1"
minio = "^7.2.0"
jieba = "^0.42.1"
rank-bm25 = "^0.2.2"
orjson = "^3.10.12"
bs4 = "^0.0.2"
requests = "^2.34.2"
paddleocr = "^3.6.0"
paddlepaddle = "^3.3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.12.0"
isort = "^5.13.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
httpx = "^0.25.2"
tabulate = "^0.9.0"
openpyxl = "^3.1.5"

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

